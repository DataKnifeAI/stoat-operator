apiVersion: stoat.dataknife.ai/v1alpha1
kind: Stoat
metadata:
  name: stoat
  namespace: stoat
spec:
  domain: chat.example.com
  version: v0.16.2
  generateSecrets: true
  dependencies:
    embed: true
  ingress:
    className: envoy
    # tlsSecretName: chat-example-tls
  livekit:
    enabled: true
    # RTC uses hostNetwork on the LiveKit pod (UDP media range on the node).
  storage:
    size: 20Gi
    # storageClassName: truenas-csi-nfs
  nodeSelector:
    kubernetes.io/os: linux
