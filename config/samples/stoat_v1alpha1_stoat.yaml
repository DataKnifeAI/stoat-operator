apiVersion: stoat.dataknife.ai/v1alpha1
kind: Stoat
metadata:
  name: stoat
  namespace: stoat
spec:
  domain: chat.example.com
  version: v0.16.2
  generateSecrets: true
  dependencies:
    embed: true
    # Option A (default): embedded MinIO/Silo — omit objectStorage.
    #
    # Option B: external S3-compatible storage (e.g. RustFS on TrueNAS).
    # Create the Secret first:
    #   kubectl -n stoat create secret generic stoat-object-storage \
    #     --from-literal=accessKeyId=... --from-literal=secretAccessKey=...
    # objectStorage:
    #   endpoint: https://rustfs.dataknife.net:30292
    #   credentialsSecret: stoat-object-storage
    #   bucket: revolt-uploads
    #   region: minio
    #   pathStyleBuckets: true
  ingress:
    className: nginx
    # tlsSecretName: chat-example-tls
  livekit:
    enabled: true
    # false (default): site-local LAN/VPN ICE (no public WAN STUN).
    # Media is hostNetwork on the node LAN — reachable from the local network,
    # not limited to the Kubernetes pod/ClusterIP network.
    useExternalIP: false
    # Optional stable LAN/VPN VIP (kube-vip). Advertised as NODE_IP; pair with
    # LoadBalancer to claim the VIP for TCP 7881 + UDP media range.
    # Omit to advertise the scheduled node's LAN IP.
    # address: "192.168.14.189"
    # serviceType: LoadBalancer
    # Optional node coords for Stoat nearest-node selection.
    # latitude: 47.6062
    # longitude: -122.3321
    # RTC uses hostNetwork on the LiveKit pod (UDP media range on the node).
  storage:
    size: 20Gi
    # Prefer a StorageClass that allows container UID ownership (e.g. no_mapall NFS).
    storageClassName: truenas-csi-nfs-no-mapall
  nodeSelector:
    kubernetes.io/os: linux
